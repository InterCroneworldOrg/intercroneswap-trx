name: Docker Image GHCR

on:
  push:
    branches:
      - dev1
  pull_request:
    branches:
      - dev1

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: intercroneworldorg/intercroneswap-trx

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev1-${{ github.sha }}
          build-args: |
            REACT_APP_CHAIN_ID=11111
            REACT_APP_TRONGRID_API_KEY=${{ secrets.TRONGRID_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
