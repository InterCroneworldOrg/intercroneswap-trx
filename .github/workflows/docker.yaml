name: Docker Image GHCR dev2

on:
  push:
    branches: [dev2]
  pull_request:
    branches: [dev2]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: intercroneworldorg/intercroneswap-trx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev2
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev2-${{ github.sha }}
          build-args: |
            REACT_APP_CHAIN_ID=11111
            REACT_APP_NETWORK_URL=https://api.trongrid.io
            REACT_APP_TRON_NETWORK=mainnet
            REACT_APP_RPC_POLLING_INTERVAL_MS=30000
            REACT_APP_RPC_CACHE_TTL_MS=12000
            REACT_APP_RPC_MIN_INTERVAL_MS=350
            REACT_APP_MARKETS_API_URL=/markets-api
          secrets: |
            trongrid_api_key=${{ secrets.TRONGRID_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
